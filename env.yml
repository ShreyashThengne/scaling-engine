env_config:
  default_environment: prd
  environments:
    - name: dev
      env:
        DBT_DATABASE: your_project_dev_db
    - name: ci
      env:
        DBT_DATABASE: your_project_prd_db # This acts as a fallback; CI pipeline will override this
    - name: acc
      env:
        DBT_DATABASE: your_project_acc_db
    - name: prd
      env:
        DBT_DATABASE: your_project_prd_db